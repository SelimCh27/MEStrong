<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Anmelden — MEStrong</title>
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="../assets/logo.png" alt="MEStrong">
      <p>Dein Gym-Tracker für echten Fortschritt</p>
    </div>
    <form class="auth-form" id="login-form">
      <h1>Willkommen zurück</h1>
      <p class="subtitle">Melde dich an und starte dein Training</p>
      <div class="form-group">
        <label for="email">E-Mail</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="name@beispiel.at" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="password">Passwort</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Anmelden</button>
    </form>
    <p class="auth-switch">Noch kein Konto? <a href="register.html">Registrieren</a></p>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>redirectIfAuthed(); initLoginForm();</script>
</body>
</html>
