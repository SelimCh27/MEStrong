<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Übung — MEStrong</title>
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div class="app-layout" id="app-shell">
    <main class="app-main wide">
      <div class="exercise-page-hero">
        <img id="exercise-hero" src="" alt="">
        <button type="button" class="exercise-page-back" onclick="history.back()" aria-label="Zurück">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <h1 id="exercise-title" style="font-size:1.35rem;font-weight:700;margin:1rem 0 0.5rem;padding:0 0.25rem"></h1>
      <div class="exercise-tabs">
        <button type="button" class="exercise-tab active" data-tab="summary">Übersicht</button>
        <button type="button" class="exercise-tab" data-tab="history">Verlauf</button>
        <button type="button" class="exercise-tab" data-tab="howto">Anleitung</button>
      </div>
      <div class="exercise-tab-panel" id="panel-summary" data-panel="summary"></div>
      <div class="exercise-tab-panel hidden" id="panel-history" data-panel="history"></div>
      <div class="exercise-tab-panel hidden" id="panel-howto" data-panel="howto"></div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/exercise-data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/exercise.js"></script>
  <script>
    if (requireAuth()) { initAppShell(); initExercisePage(); }
  </script>
</body>
</html>
