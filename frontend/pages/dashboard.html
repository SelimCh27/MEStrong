<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Home — MEStrong</title>
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div class="app-layout" id="app-shell">
    <main class="app-main">
      <div class="dash-header">
        <div>
          <h1 id="greeting-text">Hey!</h1>
          <span class="dash-date" id="dash-date"></span>
        </div>
        <img src="../assets/logo.png" alt="MEStrong" style="height:28px;opacity:0.9">
      </div>
      <div class="week-strip" id="week-strip"></div>
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-card-icon blue">🏋️</div>
          <span class="stat-card-value mono" id="stat-workouts">0</span>
          <span class="stat-card-label">Einheiten</span>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon green">📊</div>
          <span class="stat-card-value mono" id="stat-sets">0</span>
          <span class="stat-card-label">Sätze</span>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon blue">⏱</div>
          <span class="stat-card-value mono" id="stat-minutes">0</span>
          <span class="stat-card-label">Minuten</span>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon green">🔥</div>
          <span class="stat-card-value mono" id="stat-streak">1</span>
          <span class="stat-card-label">Wochen aktiv</span>
        </div>
      </div>
      <p class="section-label">Nächstes Training</p>
      <div id="dashboard-next-workout"></div>
      <p class="section-label" style="margin-top:1.25rem">Schnellzugriff</p>
      <div class="quick-grid">
        <a href="plan.html" class="quick-tile"><span class="quick-tile-icon">📋</span>Mein Plan</a>
        <a href="progress.html" class="quick-tile"><span class="quick-tile-icon">📈</span>Statistik</a>
        <a href="history.html" class="quick-tile"><span class="quick-tile-icon">📝</span>Verlauf</a>
        <a href="goal-select.html" class="quick-tile"><span class="quick-tile-icon">🎯</span>Neuer Plan</a>
      </div>
    </main>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/exercise-data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/plan.js"></script>
  <script src="../js/history.js"></script>
  <script>
    if (requireAuth()) {
      initAppShell();
      const user = getUser();
      const name = user?.email?.split('@')[0] || 'Athlet';
      document.getElementById('greeting-text').textContent = `Hey, ${name}`;
      document.getElementById('dash-date').textContent = new Date().toLocaleDateString('de-AT', { weekday: 'long', day: 'numeric', month: 'long' });
      const days = ['Mo','Di','Mi','Do','Fr','Sa','So'];
      const today = new Date().getDay();
      const strip = document.getElementById('week-strip');
      strip.innerHTML = days.map((d, i) => {
        const dayNum = new Date();
        dayNum.setDate(dayNum.getDate() - ((today + 6) % 7) + i);
        const isToday = i === (today + 6) % 7;
        return `<div class="week-day${isToday ? ' today' : ''}"><span class="wd">${d}</span><span class="wn">${dayNum.getDate()}</span></div>`;
      }).join('');
      initDashboardPlan();
      fetchHistory().then((sessions) => {
        if (sessions?.length) {
          document.getElementById('stat-workouts').textContent = sessions.length;
          document.getElementById('stat-sets').textContent = sessions.reduce((a, s) => a + s.totalSets, 0);
          document.getElementById('stat-minutes').textContent = sessions.reduce((a, s) => a + (s.duration || 0), 0);
        }
      }).catch(() => {});
    }
  </script>
</body>
</html>
