<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Statistik — MEStrong</title>
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div class="app-layout" id="app-shell">
    <main class="app-main">
      <header class="page-header">
        <h1>Statistik</h1>
        <p>Fortschritt und Personal Records pro Übung.</p>
      </header>
      <div class="exercise-select-wrap">
        <select id="exercise-select" aria-label="Übung wählen"></select>
      </div>
      <div id="progress-hero"></div>
      <div class="metric-pills">
        <button type="button" class="metric-pill active" data-metric="weight">Ø Gewicht</button>
        <button type="button" class="metric-pill" data-metric="orm">One Rep Max</button>
      </div>
      <div class="chart-wrapper">
        <canvas id="progress-chart"></canvas>
      </div>
      <div id="progress-insight"></div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/exercise-data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/progress.js"></script>
  <script>
    if (requireAuth()) { initAppShell(); initProgress(); }
  </script>
</body>
</html>
