<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Trainingstage — MEStrong</title>
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div class="app-layout" id="app-shell">
    <main class="app-main">
      <div class="step-indicator">
        <span class="step-dot done"></span>
        <span class="step-dot active"></span>
        <span class="step-dot"></span>
      </div>
      <header class="page-header">
        <h1>Wie oft trainierst du?</h1>
        <p>Wähle deine Trainingstage pro Woche.</p>
      </header>
      <div class="days-panel">
        <span class="days-goal-badge" id="days-goal-label">—</span>
        <div class="days-display">
          <div class="days-number" id="days-value">4</div>
          <div class="days-label">Tage pro Woche</div>
        </div>
        <input type="range" class="days-slider" id="days-slider" min="1" max="7" value="4">
        <div class="day-pills">
          <button type="button" class="day-pill" data-days="1">1</button>
          <button type="button" class="day-pill" data-days="2">2</button>
          <button type="button" class="day-pill" data-days="3">3</button>
          <button type="button" class="day-pill active" data-days="4">4</button>
          <button type="button" class="day-pill" data-days="5">5</button>
          <button type="button" class="day-pill" data-days="6">6</button>
          <button type="button" class="day-pill" data-days="7">7</button>
        </div>
        <p class="split-hint">Empfohlener Split: <strong id="split-hint">Ober-/Unterkörper</strong></p>
      </div>
      <button type="button" class="btn btn-primary btn-block btn-lg" id="days-generate">Plan erstellen</button>
    </main>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/plan.js"></script>
  <script>
    if (requireAuth()) { initAppShell(); initDaysSelect(); }
  </script>
</body>
</html>
